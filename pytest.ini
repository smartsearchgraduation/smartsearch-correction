[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    flaky: marks tests known to be flaky
    integration: full request-cycle integration tests (5.4.3 perf rows;
        also covers backend_to_correction integration where Correction is
        called as a downstream service)
filterwarnings =
    ignore::DeprecationWarning
